
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-white2: #F6F2ED;
      --color-white3: #FEFAF5;
      --color-white4: #F8F6F3;
      --text-color: #616161;
      --primary-color: #D4F772;
      --dark: #1a1a1a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--color-white2);
      color: var(--text-color);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== BACKGROUND ===== */
    .page-bg {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      background: linear-gradient(135deg, var(--color-white2) 0%, var(--color-white3) 50%, var(--color-white4) 100%);
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.45;
      animation: floatOrb 20s ease-in-out infinite;
    }
    .orb-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(212,247,114,0.45) 0%, transparent 70%);
      top: -15%; left: -10%; animation-delay: 0s;
    }
    .orb-2 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(212,247,114,0.3) 0%, transparent 70%);
      bottom: -15%; right: -10%; animation-delay: -7s;
    }
    .orb-3 {
      width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(97,97,97,0.08) 0%, transparent 70%);
      top: 50%; left: 60%; animation-delay: -14s;
    }
    @keyframes floatOrb {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(30px,-25px) scale(1.05); }
      66% { transform: translate(-25px,30px) scale(0.95); }
    }

    .grid-overlay {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.025) 1px, transparent 1px);
      background-size: 70px 70px;
      mask-image: radial-gradient(ellipse at center, black 35%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 80%);
    }

    .floating-shape {
      position: absolute; border-radius: 16px; opacity: 0.07;
      animation: floatShape 16s ease-in-out infinite;
    }
    .shape-1 { width: 90px; height: 90px; background: var(--primary-color); top: 10%; left: 8%; transform: rotate(15deg); animation-delay: 0s; --r: 15deg; }
    .shape-2 { width: 70px; height: 70px; background: var(--text-color); top: 75%; left: 12%; border-radius: 50%; animation-delay: -5s; --r: -10deg; }
    .shape-3 { width: 120px; height: 50px; background: var(--primary-color); top: 20%; right: 10%; transform: rotate(-5deg); animation-delay: -10s; --r: -5deg; }
    .shape-4 { width: 60px; height: 60px; border: 3px solid var(--text-color); top: 80%; right: 18%; transform: rotate(25deg); background: transparent; animation-delay: -3s; --r: 25deg; }
    .shape-5 { width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary-color), transparent); top: 45%; left: 3%; border-radius: 50%; animation-delay: -8s; --r: 0deg; }
    @keyframes floatShape {
      0%,100% { transform: translateY(0) rotate(var(--r,0deg)); }
      50% { transform: translateY(-20px) rotate(calc(var(--r,0deg) + 10deg)); }
    }

    /* ===== CONTENT ===== */
    .content {
      position: relative; z-index: 1;
      text-align: center; padding: 40px 24px; max-width: 600px;
    }

    /* 404 Number */
    .error-code {
      font-size: clamp(120px, 22vw, 220px);
      font-weight: 900;
      line-height: 1;
      color: transparent;
      background: linear-gradient(135deg, var(--primary-color) 0%, #a8d94a 50%, var(--primary-color) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      letter-spacing: -8px;
      position: relative;
      display: inline-block;
      animation: glowPulse 3s ease-in-out infinite;
    }
    .error-code::after {
      content: '404';
      position: absolute; left: 0; top: 0; right: 0;
      color: transparent;
      background: linear-gradient(135deg, var(--primary-color) 0%, #a8d94a 50%, var(--primary-color) 100%);
      -webkit-background-clip: text; background-clip: text;
      filter: blur(30px); opacity: 0.4;
      z-index: -1;
      animation: glowPulse 3s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%,100% { filter: brightness(1); }
      50% { filter: brightness(1.15); }
    }

    /* Face in zero */
    .zero-face {
      display: inline-block;
      position: relative;
    }
    .zero-face::before,
    .zero-face::after {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      background: var(--dark);
      border-radius: 50%;
      top: 38%;
      animation: blink 4s ease-in-out infinite;
    }
    .zero-face::before { left: 28%; }
    .zero-face::after { right: 28%; }
    @keyframes blink {
      0%,45%,55%,100% { transform: scaleY(1); }
      50% { transform: scaleY(0.1); }
    }

    .error-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .error-desc {
      font-size: 16px;
      color: var(--text-color);
      line-height: 1.7;
      margin-bottom: 36px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 14px 32px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      border: none;
    }
    .btn-primary {
      background: var(--primary-color);
      color: var(--dark);
      box-shadow: 0 4px 20px rgba(212,247,114,0.3);
    }
    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(212,247,114,0.4);
    }
    .btn-secondary {
      background: var(--color-white4);
      color: var(--dark);
      border: 1.5px solid #E0DCD7;
    }
    .btn-secondary:hover {
      background: var(--color-white3);
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }

    /* Logo */
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      color: var(--dark);
      margin-bottom: 48px;
      text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: var(--primary-color);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      box-shadow: 0 4px 16px rgba(212,247,114,0.3);
    }

    /* Breadcrumb trail */
    .breadcrumb {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 40px;
      font-size: 13px;
      color: #A9A5A0;
    }
    .breadcrumb a {
      color: var(--text-color);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .breadcrumb a:hover { color: var(--dark); }
    .breadcrumb-sep { opacity: 0.4; }

    @media (max-width: 520px) {
      .error-title { font-size: 22px; }
      .error-desc { font-size: 14px; }
      .btn { padding: 12px 24px; font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="page-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
    <div class="floating-shape shape-1" style="--r:15deg"></div>
    <div class="floating-shape shape-2" style="--r:-10deg"></div>
    <div class="floating-shape shape-3" style="--r:-5deg"></div>
    <div class="floating-shape shape-4" style="--r:25deg"></div>
    <div class="floating-shape shape-5" style="--r:0deg"></div>
  </div>

  <div class="content">
    <div class="logo">
  <img src="assets/images/logo.webp" alt="Stackly Logo" class="logo-image">
</div>

    <div class="error-code">4<span class="zero-face">0</span>4</div>

    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      Oops! The page you are looking for seems to have wandered off into the digital wilderness.
      Let us help you find your way back.
    </p>

    <div class="btn-group">
      <a href="index.html" class="btn btn-primary">← Back to Home</a>
      <a href="javascript:history.back();" class="btn btn-secondary">
    ← Go Back
</a>
    </div>
  </div>

</body>
</html>
